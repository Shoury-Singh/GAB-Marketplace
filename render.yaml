databases:
  - name: gab-platform-db
    databaseName: gab_platform
    user: gab_platform
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
    diskSizeGB: 1

services:
  - type: web
    name: gab-platform
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn gab.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    disk:
      name: gab-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SETTINGS_MODULE
        value: gab.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: GAB_CUSTOM_DOMAIN
        value: gabpt.com
      - key: DATABASE_URL
        fromDatabase:
          name: gab-platform-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data
